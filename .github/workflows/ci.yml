name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hub-src/package-lock.json
      - name: Install
        if: runner.os != 'Linux'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Install with Electron
        if: runner.os == 'Linux'
        run: npm ci
      - run: npm ci --prefix hub-src
      - run: npm run check
      - run: npm run build:hub
      - name: Electron tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # npm ci may leave the binary unextracted; install.js is a no-op when it is already there.
          node node_modules/electron/install.js
          # GitHub's runner cannot use the user-namespace sandbox. Electron aborts unless
          # chrome-sandbox is a root-owned setuid helper. This does not change the tests.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npx electron tests/electron-cover.cjs
          xvfb-run -a npx electron tests/smoke-think.cjs
          xvfb-run -a npx electron tests/e2e/think-review.cjs
          xvfb-run -a npm run smoke
